name: wiki-sync

# The wiki is not rendered nightly like /docs — most of it is prose written
# once. Two pages are derived from the index and would rot: Standards (counted
# from data/index.json, which the nightly job refreshes) and Glossary (text from
# data/glossary.json, exported from the app repo). This job regenerates those
# two weekly and pushes only if they changed.

on:
  schedule:
    - cron: "40 13 * * 1"
  workflow_dispatch: {}

concurrency:
  group: wiki-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Clone the wiki
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki
      - name: Regenerate the derived pages
        run: node scripts/wiki-sync.mjs --wiki wiki
      - name: Push if changed
        working-directory: wiki
        run: |
          git config user.name "Sato"
          git config user.email "304106862+satohubai@users.noreply.github.com"
          git add Standards.md Glossary.md
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "wiki: regenerate derived pages — $(date -u +%F)"
            git push
          fi
